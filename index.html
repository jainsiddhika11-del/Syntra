<!DOCTYPE html>
<html>
<head>
  <title>Syntra</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      text-align: center;
      padding: 30px;
    }
    .chatbox {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }
    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      text-align: left;
    }
    input {
      width: 65%;
      padding: 10px;
    }
    button {
      padding: 10px;
      cursor: pointer;
    }
    p {
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <div class="chatbox">
    <h1>Syntra</h1>
    <p>Your simple chatbot assistant!</p>

    <div id="messages">
      <p><b>Bot:</b> Hello! I am Syntra. Ask me something!</p>
    </div>

    <input id="userInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");
      const text = input.value.trim();

      if (text === "") return;

      messages.innerHTML += "<p><b>You:</b> " + text + "</p>";

      const msg = text.toLowerCase();
      let reply;

      if (msg.includes("hello") || msg.includes("hi")) {
        reply = "Hello! How can I help you?";
      } else if (msg.includes("name")) {
        reply = "I am Syntra!";
      } else if (msg.includes("how are you")) {
        reply = "I am doing great! Thanks for asking.";
      } else if (msg.includes("help")) {
        reply = "You can ask me about my name or how I work.";
      } else if (msg.includes("bye")) {
        reply = "Goodbye! Have a great day!";
      } else {
        reply = "Interesting! Tell me more.";
      }

      messages.innerHTML += "<p><b>Bot:</b> " + reply + "</p>";
      messages.scrollTop = messages.scrollHeight;
      input.value = "";
    }
  </script>

</body>
</html>
